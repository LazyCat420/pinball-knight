name: CI

# What this can and cannot cover, stated once so nobody re-litigates it:
#
# CANNOT — `scripts/pk-check.mjs` and both visual A/B rigs need a real GPU.
# SwiftShader cannot run the Bevy wasm app at all (mapped-buffer defect, see
# docs Incidents), so the end-to-end and visual gates stay manual, on the host
# Chrome of the dev box. That is a property of the app, not a gap here.
#
# CAN — everything else, which at 28k lines of Rust across four build targets
# had been running nowhere. In particular the two target-parity gates added
# after `js_pow` turned out to be a different function on each of wasm, Windows
# and native: both are pure computation, so they belong here rather than in the
# manual pile.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer stale, not
# interesting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fixture replay is bit-exact; a backtrace is the difference between "a digest
  # moved" and knowing which pass moved it.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins 1.94.1 and the two cross targets, so the
      # toolchain is not configured here — it is configured in the repo, and
      # this action honours it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

      # ⚠️ Per-crate, NOT `--workspace`. A deny-level lint aborts the whole
      # workspace invocation at the first crate that trips, which is how four
      # errors once hid and left pk-game/pk-audio/xtask unlinted for weeks. One
      # crate failing must not stop the others being checked.
      - run: cargo clippy -p pk-core --all-targets -- -D warnings
        if: '!cancelled()'
      - run: cargo clippy -p pk-assets --all-targets -- -D warnings
        if: '!cancelled()'
      - run: cargo clippy -p pk-audio --all-targets -- -D warnings
        if: '!cancelled()'
      - run: cargo clippy -p pk-game --all-targets -- -D warnings
        if: '!cancelled()'
      - run: cargo clippy -p xtask --all-targets -- -D warnings
        if: '!cancelled()'

      - run: cargo test --workspace
        if: '!cancelled()'

  target-parity:
    name: jsmath on the shipped targets
    runs-on: ubuntu-latest
    # The gate that did not exist when `js_pow` was three different functions
    # (see docs Incidents). Both halves are pure arithmetic — no GPU, no browser.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: jsmath under wasm32-unknown-unknown
        run: node scripts/jsmath-wasm-check.mjs --build

      # ⚠️ This one is INFORMATIONAL here and load-bearing on the dev box.
      # Running the Windows test binary needs a wine/interop runner that the
      # repo configures for WSL2 only (`scripts/win-runner.sh`), so CI can build
      # it but not run it. The run stays a dev-box step:
      #   cargo test --target x86_64-pc-windows-gnullvm -p pk-core --test jsmath_oracle
      - name: windows-gnullvm builds
        run: cargo build --target x86_64-pc-windows-gnullvm -p pk-core

  wasm-build:
    name: wasm build + size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p pk-game --release
      - name: report the wasm size
        # Reported, not yet enforced: a budget invented in CI rather than
        # measured against a shipped build is a number that fails on the day
        # someone adds a legitimate feature. `xtask dist` (wasm-opt + brotli) is
        # what sets the real one — P8.
        run: |
          f=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' | head -1)
          echo "$f: $(du -h "$f" | cut -f1)"

  legacy:
    name: legacy vitest (the oracle)
    runs-on: ubuntu-latest
    # `legacy/` is not archived reference material — it exports every parity
    # fixture the Rust side replays. A red legacy suite means the oracle moved,
    # which is a bigger deal than a red port.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy/package-lock.json
      - run: npm ci
        working-directory: legacy
      # `npm test` (not used here) routes through `scripts/ops/pk-run.sh`, the
      # flock'd thread broker that keeps a shared 24-thread dev box usable. A
      # GitHub runner is not shared and has no locks to take, so the meter would
      # be pure overhead — and a `--class test` grant it cannot satisfy reads as
      # a failure rather than a queue. `test:raw` is the same vitest run without
      # the broker. On the dev box, keep using `npm test`.
      - run: npm run test:raw

  coverage:
    name: 1:1 coverage (C-1)
    runs-on: ubuntu-latest
    # The number in docs/src/status/one-to-one.md goes stale the moment it is
    # written — v1's was two commits old within a day of shipping. Printing it
    # per run makes "how much is left" a fact of the build rather than a
    # measurement someone has to remember to re-take.
    #
    # The heuristic stays REPORTED, not enforced: a ratchet on it would gate
    # real work on a value that moves without anything being ported.
    #
    # ⚠️ 2026-08-12 — THE LEDGER IS NOW ENFORCED. It used to be reported too,
    # on the grounds that a ratchet had to wait until the exclusion registry
    # was complete or it would gate against an unreachable ceiling. Both halves
    # of that are now true: `EXCLUSIONS` carries five entries with their
    # decisions, `DEFERRED` carries the post-parity ones, and TIER 2 closed the
    # denominator hole (15,430 sibling lines the game loads that were in no
    # bucket at all). So `converted_pct` has a reachable ceiling and may not
    # fall.
    #
    # It is the ONE hard ratchet in this project, and it can be, because it is
    # the one instrument that reads no GPU, no browser and no shared box —
    # deterministic, therefore banded at zero. Everything else has to reason
    # about noise and returns INCONCLUSIVE rather than red on a busy machine.
    #
    # ⚠️ The two disagree, and the ledger is the honest one. Measured
    # 2026-08-12: heuristic 50% uncovered, ledger 22.4% CONVERTED. The gap is
    # ASSUMPTION-1 made concrete — the shell scan counts a legacy file as
    # covered when any `.rs` merely mentions it, which scored `maze/decorate.ts`
    # (3,169 lines, zero written) as done off a prose comment. Both are printed
    # so the divergence stays visible rather than being quietly resolved in
    # favour of the flattering one.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the heuristic (upper bound — C-1)
        run: bash scripts/pk-coverage.sh
      - name: the provenance ledger (exact — P-1)
        run: cargo run -q -p xtask -- coverage --todo
      # THE RATCHET. `check` exits 1 on a regression, 4 if `coverage.rs` itself
      # was edited without re-recording (an edited ruler is a different ruler),
      # and 3 if it could not tell. All three are failures here, because for a
      # deterministic instrument "could not tell" should be impossible.
      - name: the ledger may not go backwards
        run: |
          mkdir -p .checks
          cargo run -q -p xtask -- coverage --json > .checks/ledger.json
          node scripts/pk-baseline.mjs check ledger --from .checks/ledger.json
      - name: baselines lint
        run: node scripts/pk-baseline.mjs lint

  drift:
    name: oracle rot (D-1)
    runs-on: ubuntu-latest
    # `legacy/` is the oracle for every fixture and every A/B sheet, AND a
    # filtered extraction of braindeadbot-client's live PK tree. A gameplay fix
    # landed there makes the oracle wrong while every fixture stays green.
    #
    # ⚠️ braindeadbot-client is a PRIVATE repo, so this job can only run where a
    # token reaches it. Without one it does NOT quietly pass: the gate script
    # exits 2 for "cannot check", and the step raises a GitHub warning
    # annotation saying so in as many words. A gate that reports green when it
    # did not run is worse than no gate, because it retires the worry.
    #
    # On the dev box, where both trees exist, run it directly:
    #   bash scripts/pk-drift.sh ../braindeadbot-client
    steps:
      - uses: actions/checkout@v4
      - name: fetch the live PK tree
        if: ${{ secrets.BDB_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: LazyCat420/braindeadbot-client
          token: ${{ secrets.BDB_TOKEN }}
          path: .bdb
      - name: diff the oracle against the live game
        run: |
          if [ -d .bdb ]; then
            bash scripts/pk-drift.sh "$PWD/.bdb"
          else
            bash scripts/pk-drift.sh /definitely-not-here || true
            echo "::warning title=D-1 did not run::No BDB_TOKEN secret, so the oracle-rot gate could NOT check braindeadbot-client. This job is green because nothing failed, NOT because the trees agree."
          fi
        working-directory: legacy
