[workspace]
resolver = "2"
members = [
    "crates/pk-core",
    "crates/pk-jsmath-probe",
    "crates/pk-assets",
    "crates/pk-audio",
    "crates/pk-game",
    "crates/pk-gui",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LazyCat420/pinball-knight"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# BOTH features are LOAD-BEARING, and each was learned from a defect.
#
# float_roundtrip: serde_json's default float parse is fast but up to 1 ulp
# lossy, which broke the first bit-exact fixture replay (0.9100000000000037
# parsed as …36). Parity fixtures demand exact parsing.
#
# preserve_order: without it `Map` is a `BTreeMap`, so a parsed object iterates
# ALPHABETICALLY and the fixture's own key order is destroyed at parse time.
# `maze_pass_digests`'s `assert_record` compares each pass's `extra` POSITIONALLY
# and documents that "an order change is a change" — which was simply not true
# for two years' worth of boundaries, because no boundary before `endpoints-early`
# had more than one key for the sort to reorder. It failed on `start`/`stairs`
# (alphabetically `stairs` first) the moment one did.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
libm = "0.2"
enum-map = { version = "2", features = ["serde"] }
strum = { version = "0.27", features = ["derive"] }
slotmap = "1"

# The sim (pk-core) must stay deterministic across native and wasm:
#   - f64 everywhere (JS numbers are f64; f32 silently breaks every golden fixture)
#   - transcendentals through `libm`, never std (std sin/cos differ across platforms)
#   - no HashMap iteration in sim logic; randomness only via the seeded PRNG in SimState

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# wasm release: switch opt-level to "z" and panic = "abort" via xtask dist
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
