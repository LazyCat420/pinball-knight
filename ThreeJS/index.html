<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pinball Knight</title>
    <meta name="description" content="3D Pinball Dungeon Crawler in Three.js and WebGPU" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0d12;
        color: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /*
        THE ON-SCREEN PAD DOES NOT WORK WITHOUT THIS.

        `gui/touch.ts` tracks a thumb across pointerdown -> pointermove, and the
        browser owns that gesture until told otherwise. Measured on an emulated
        iPhone against the deployed build, dragging the movement stick:

            pointerdown 1, pointermove 1, pointercancel 1, pointerup 0

        One sample, then the browser claimed the touch as a pan and CANCELLED
        it — so the stick moved once and froze, and because `pointerup` never
        arrived, anything held stayed held. `e.preventDefault()` in the handler
        cannot fix that: for touch the decision is made by `touch-action`
        before the listener is consulted.

        `none` on the scroll container is the whole cure. The rest close the
        other gestures a phone browser applies to a full-screen canvas:
        `overscroll-behavior` kills Android pull-to-refresh, and the two
        -webkit- rules kill iOS's long-press callout and the double-tap
        highlight flash (iOS has ignored `user-scalable=no` since iOS 10, so
        the meta tag above is not enough on its own).
      */
      html, body, #application-container, canvas {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #application-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #fallback-notice {
        display: none;
        position: fixed;
        inset: 0;
        background: #0b0d12;
        color: #f87171;
        padding: 2rem;
        z-index: 99999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: monospace;
      }
      #fallback-notice h1 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #fbbf24;
      }
      #fallback-notice p {
        max-width: 600px;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div id="application-container"></div>
    <div id="fallback-notice">
      <h1>⚠️ WebGPU Context Notice</h1>
      <p id="fallback-reason">WebGPU is required to run Pinball Knight.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
