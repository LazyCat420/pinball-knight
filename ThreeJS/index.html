<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pinball Knight</title>
    <meta name="description" content="3D Pinball Dungeon Crawler in Three.js and WebGPU" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0d12;
        color: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #application-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #fallback-notice {
        display: none;
        position: fixed;
        inset: 0;
        background: #0b0d12;
        color: #f87171;
        padding: 2rem;
        z-index: 99999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: monospace;
      }
      #fallback-notice h1 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #fbbf24;
      }
      #fallback-notice p {
        max-width: 600px;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div id="application-container"></div>
    <div id="fallback-notice">
      <h1>⚠️ WebGPU Context Notice</h1>
      <p id="fallback-reason">WebGPU is required to run Pinball Knight.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
