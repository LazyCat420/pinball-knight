server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security and isolation headers for WebGPU and WebAssembly
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Explicit MIME types for WebGPU / Shaders / WebAssembly
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/wasm                      wasm;
        text/plain                            wgsl;
        image/png                             png;
        image/jpeg                            jpeg jpg;
        image/svg+xml                         svg;
        image/webp                            webp;
        font/woff2                            woff2;
        audio/mpeg                            mp3;
        audio/ogg                             ogg;
        audio/wav                             wav;
    }

    # SPA routing
    #
    # ⚠️ THE HTML MUST NEVER BE CACHED, and it was.
    #
    # index.html is the only file that names the build: it points at
    # /assets/index-<contenthash>.js, and that hash is what makes the bundle
    # safe to serve `immutable` below. Served with NO Cache-Control at all — as
    # it was — a browser applies HEURISTIC freshness (RFC 9111 §4.2.2: about a
    # tenth of the document's age) and keeps serving the OLD index.html, which
    # names the OLD bundle, which is still in the immutable cache. The player
    # then reloads, sees no change, and every deploy is invisible to them for
    # as long as the heuristic holds.
    #
    # That is not theoretical: it is the shape of "we fixed the death animation
    # three times and it still does not play for me" — the fixes shipped, the
    # returning browser kept running the build from before them.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # ── SPRITE SIDECARS ── the manifests, which must always be current.
    #
    # A sidecar names the CELL RECTS and the PNG's content `hash`; the runtime
    # appends that hash to the image URL (versioned(), render/imported-paints.ts)
    # so the image below can be cached hard and still never go stale. That only
    # works while the sidecar itself is fresh — a cached sidecar pins the cache
    # key it was meant to break.
    location ~* ^/sprites/.*\.json$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # Cache static assets. Every one of these is either content-hashed in its
    # filename (vite's /assets) or reached through a `?v=<hash>` the sidecar
    # supplies, so `immutable` is safe here and only here.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|wasm|woff2?|eot|ttf|svg|ogg|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }
}
