server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security and isolation headers for WebGPU and WebAssembly
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Explicit MIME types for WebGPU / Shaders / WebAssembly
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        application/wasm                      wasm;
        text/plain                            wgsl;
        image/png                             png;
        image/jpeg                            jpeg jpg;
        image/svg+xml                         svg;
        image/webp                            webp;
        font/woff2                            woff2;
        audio/mpeg                            mp3;
        audio/ogg                             ogg;
        audio/wav                             wav;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|wasm|woff2?|eot|ttf|svg|ogg|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }
}
