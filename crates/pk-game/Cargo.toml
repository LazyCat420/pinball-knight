[package]
name = "pk-game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pinball Knight — the Bevy app (render, input, GUI, fx, boot)"

[lib]
name = "pk_game"
path = "src/lib.rs"

[[bin]]
name = "pk-game"
path = "src/main.rs"

[dependencies]
pk-core = { path = "../pk-core" }
pk-assets = { path = "../pk-assets" }
pk-audio = { path = "../pk-audio" }
pk-gui = { path = "../pk-gui" }
# The authored-floor payloads (`assets/floors/*.json`) are deserialised into
# derived structs — pk-game is the only crate that does this. pk-core carries
# ZERO serde derives on purpose (its types answer to a JS oracle, not to a file
# format), so the wire types live in `authored_floor.rs` and convert at the
# boundary.
serde = { workspace = true }
serde_json = { workspace = true }
libm = { workspace = true }
# PNG decode for the embedded knight sheets — bypasses bevy_asset io entirely
# (works identically on native and wasm; the slice embeds its art).
image = { version = "0.25", default-features = false, features = ["png"] }

# WebGPU-only on the web per house policy (webgl2 stays OFF; legacy
# src/render/backend.ts deliberately defeated the WebGL fallback).
# wasm-only: the window.__pk debug surface (the __lab() seed) that
# scripts/pk-check.mjs reads to verify the sim from outside.
#
# `web-sys` is wasm-ONLY and must stay here: it has no native implementation,
# and the Windows target (`x86_64-pc-windows-gnullvm`) is a shipped build, not a
# hypothetical. `real_floor.rs` reads `location.search` through its typed
# `UrlSearchParams` rather than `js_sys::eval` — the flag takes NUMBERS off a
# URL, and a number spliced into an eval string is a different class of thing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "UrlSearchParams",
    # `performance.now()`. NOT `Date.now()`: the loading state measures
    # intervals of tens of milliseconds and Date.now() is millisecond-resolution
    # and free to jump.
    "Performance",
] }

[dependencies.bevy]
version = "0.17"
default-features = false
features = [
    # WITHOUT THIS THE ENGINE IS SILENT. `tracing` has no subscriber unless
    # bevy_log installs one, so every Bevy warning, every wgpu validation
    # error and every naga shader-compile failure is discarded — a broken
    # shader presents as a clean-exiting process that merely looks wrong.
    # Measured: a 30 s run of the release exe printed nothing at all.
    "bevy_log",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_asset",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
    "multi_threaded",
    "bevy_state",
    "x11",
    "webgpu",
]
