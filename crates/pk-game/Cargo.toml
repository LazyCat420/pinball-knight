[package]
name = "pk-game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pinball Knight — the Bevy app (render, input, GUI, fx, boot)"

[dependencies]
pk-core = { path = "../pk-core" }
pk-assets = { path = "../pk-assets" }
pk-audio = { path = "../pk-audio" }
serde_json = { workspace = true }
libm = { workspace = true }
# PNG decode for the embedded knight sheets — bypasses bevy_asset io entirely
# (works identically on native and wasm; the slice embeds its art).
image = { version = "0.25", default-features = false, features = ["png"] }

# WebGPU-only on the web per house policy (webgl2 stays OFF; legacy
# src/render/backend.ts deliberately defeated the WebGL fallback).
# wasm-only: the window.__pk debug surface (the __lab() seed) that
# scripts/pk-check.mjs reads to verify the sim from outside.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.bevy]
version = "0.17"
default-features = false
features = [
    # WITHOUT THIS THE ENGINE IS SILENT. `tracing` has no subscriber unless
    # bevy_log installs one, so every Bevy warning, every wgpu validation
    # error and every naga shader-compile failure is discarded — a broken
    # shader presents as a clean-exiting process that merely looks wrong.
    # Measured: a 30 s run of the release exe printed nothing at all.
    "bevy_log",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_asset",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
    "multi_threaded",
    "bevy_state",
    "x11",
    "webgpu",
]
