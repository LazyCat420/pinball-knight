[project]
name = "spriteforge"
version = "0.1.0"
description = "Sprite-sheet import pipeline: gate, matte, slice, resample, palette snap. Palette-agnostic."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10", "scipy>=1.11"]

[project.scripts]
spriteforge = "spriteforge.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spriteforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
